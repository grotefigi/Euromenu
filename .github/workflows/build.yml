name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unpack EuroMenu project
        run: |
          echo '' | base64 -d > /tmp/euromenu.zip
          echo 'cf8c16881c3ee98e802ef4a59c3ed4c211fb07ab7c903f87236256c49456a957  /tmp/euromenu.zip' | sha256sum -c -
          unzip -o /tmp/euromenu.zip -d .
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EuroMenu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
